[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc2zen"
dynamic = ["version"]
description = "Migrate all Arc workspaces data into Zen."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "lz4>=4.3.0",
]

[project.optional-dependencies]
desktop = [
  "psutil>=5.9.0",
  "PySide6>=6.7.0",
]
build = [
  "psutil>=5.9.0",
  "PySide6>=6.7.0",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
arc2zen = "arc2zen.cli:main"

[project.gui-scripts]
arc2zen-desktop = "arc2zen.desktop:main"

[tool.setuptools.dynamic]
version = {attr = "arc2zen.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arc2zen = ["mods/*/*"]
