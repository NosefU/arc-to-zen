name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"

      - name: Compile Python sources
        run: python -m compileall -q cli.py desktop.py src scripts

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Import every module and open the window
        run: python scripts/check_desktop.py
