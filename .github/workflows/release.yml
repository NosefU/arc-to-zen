name: Release Desktop Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails when the tag doesn't match the package version or CHANGELOG.md has no section for it
      - name: Take the notes from CHANGELOG.md
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          previous=$(git tag --list "v*" --sort=-v:refname --merged HEAD | grep -vx "$RELEASE_TAG" | head -n 1 || true)
          python scripts/release_notes.py "$RELEASE_TAG" --previous "$previous" --repo "${{ github.repository }}" > release-notes.md
          cat release-notes.md

      - name: Upload notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.platform_label }}
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform_label: windows-x64
          - os: macos-15-intel
            platform_label: macos-x64
          - os: macos-15
            platform_label: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build desktop artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PLATFORM_LABEL: ${{ matrix.platform_label }}
        run: |
          python scripts/build_desktop.py \
            --version "$RELEASE_TAG" \
            --platform-label "$PLATFORM_LABEL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arc-to-zen-${{ matrix.platform_label }}
          path: release-artifacts/*

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: arc-to-zen-*
          path: release-assets
          merge-multiple: true

      - name: Download notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Add checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # A new release is a draft: check it on the Releases page and publish it there
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "arc-to-zen $RELEASE_TAG" \
              --notes-file release-notes.md \
              --draft
          fi
